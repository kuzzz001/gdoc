<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 吉智文档 Gdoc</title>
    <script src="/js/vue.global.prod.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f0f6ff 0%, #e1efff 50%, #cce0ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(66,133,244,0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(26,115,232,0.08) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 80%, rgba(138,180,248,0.06) 0%, transparent 45%);
            animation: float 25s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(1%, -2%) rotate(1deg); }
            66% { transform: translate(-2%, 1%) rotate(-1deg); }
        }
        .container {
            position: relative;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 
                0 12px 48px rgba(26,115,232,0.15),
                0 4px 12px rgba(0,0,0,0.05),
                inset 0 1px 0 rgba(255,255,255,0.8);
            width: 440px;
            padding: 52px 44px 44px;
            border: 1px solid rgba(26,115,232,0.1);
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            text-align: center;
            margin-bottom: 36px;
        }
        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #1a73e8 0%, #4285f4 50%, #669df6 100%);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #fff;
            margin-bottom: 18px;
            box-shadow: 
                0 6px 16px rgba(26,115,232,0.35),
                0 2px 6px rgba(26,115,232,0.2);
            transition: transform 0.3s ease;
        }
        .logo-icon:hover {
            transform: scale(1.05) rotate(2deg);
        }
        .logo-text {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #1a73e8 0%, #4285f4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1.5px;
        }
        .logo-sub {
            font-size: 13px;
            color: #8a9bb5;
            margin-top: 6px;
            letter-spacing: 3px;
            font-weight: 500;
        }
        .tabs {
            display: flex;
            margin-bottom: 32px;
            background: #f0f4f8;
            border-radius: 12px;
            padding: 5px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 11px 0;
            cursor: pointer;
            color: #5f6368;
            font-size: 14px;
            font-weight: 500;
            border-radius: 9px;
            transition: all 0.25s ease;
        }
        .tab.active {
            background: #fff;
            color: #1a73e8;
            box-shadow: 0 2px 6px rgba(26,115,232,0.12);
            font-weight: 600;
        }
        .tab:hover:not(.active) {
            color: #1a73e8;
            background: rgba(255,255,255,0.5);
        }
        .form-group { margin-bottom: 22px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #3c4043;
            margin-bottom: 9px;
            letter-spacing: 0.3px;
        }
        .form-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1.5px solid #d4dce6;
            border-radius: 11px;
            font-size: 15px;
            transition: all 0.2s ease;
            outline: none;
            background: #f8fafc;
            color: #3c4043;
        }
        .form-group input::placeholder { color: #9aa0a6; }
        .form-group input:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 4px rgba(26,115,232,0.1);
            background: #fff;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 11px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            background: linear-gradient(135deg, #1a73e8 0%, #4285f4 100%);
            color: #fff;
            box-shadow: 
                0 4px 12px rgba(26,115,232,0.3),
                0 2px 4px rgba(26,115,232,0.2);
            margin-top: 10px;
            letter-spacing: 0.5px;
        }
        .btn:hover {
            box-shadow: 0 6px 20px rgba(26,115,232,0.4);
            transform: translateY(-2px);
        }
        .btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(26,115,232,0.3);
        }
        .btn:disabled {
            background: #dadce0;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        .error {
            background: linear-gradient(135deg, #fce8e6 0%, #f8d7da 100%);
            color: #d93025;
            font-size: 13px;
            padding: 11px 15px;
            border-radius: 9px;
            margin-bottom: 18px;
            text-align: center;
            border: 1px solid #f5c6cb;
            animation: shake 0.3s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .footer {
            text-align: center;
            margin-top: 28px;
            font-size: 12px;
            color: #8a9bb5;
            letter-spacing: 1px;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div id="app">
    <div class="container">
        <div class="logo">
            <div class="logo-icon">📄</div>
            <div class="logo-text">吉智文档</div>
            <div class="logo-sub">GDOC</div>
        </div>
        <div class="tabs">
            <div class="tab" :class="{active: mode==='login'}" @click="mode='login'">登录</div>
            <div class="tab" :class="{active: mode==='register'}" @click="mode='register'">注册</div>
        </div>
        <div class="error" v-if="errorMsg">{{ errorMsg }}</div>
        <form @submit.prevent="submit">
            <div class="form-group">
                <label>用户名</label>
                <input v-model="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input v-model="password" type="password" placeholder="请输入密码" required>
            </div>
            <div class="form-group" v-if="mode==='register'">
                <label>昵称（选填）</label>
                <input v-model="nickname" placeholder="取个好听的名字">
            </div>
            <button class="btn" type="submit" :disabled="loading">
                {{ loading ? '请稍候...' : (mode === 'login' ? '登 录' : '注 册') }}
            </button>
        </form>
        <div class="footer">实时协同 · 安全高效 · 云端同步</div>
    </div>
</div>
<script>
const { createApp } = Vue;
createApp({
    data() {
        return {
            mode: 'login',
            username: '',
            password: '',
            nickname: '',
            errorMsg: '',
            loading: false
        };
    },
    methods: {
        async submit() {
            this.errorMsg = '';
            this.loading = true;
            const url = this.mode === 'login' ? '/api/auth/login' : '/api/auth/register';
            const body = { username: this.username, password: this.password };
            if (this.nickname) body.nickname = this.nickname;
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const json = await res.json();
                if (json.code === 200) {
                    if (this.mode === 'login') {
                        localStorage.setItem('token', json.data.token);
                        localStorage.setItem('user', JSON.stringify(json.data));
                        location.href = '/index.html';
                    } else {
                        this.mode = 'login';
                        this.username = '';
                        this.password = '';
                        this.nickname = '';
                        alert('注册成功，请登录');
                    }
                } else {
                    this.errorMsg = json.message;
                }
            } catch (e) {
                this.errorMsg = '网络错误，请稍后重试';
            }
            this.loading = false;
        }
    }
}).mount('#app');
</script>
</body>
</html>
