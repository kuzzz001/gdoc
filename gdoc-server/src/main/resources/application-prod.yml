server:
  port: ${PORT:8080}

spring:
  datasource:
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gdoc}
    username: ${DATABASE_USERNAME:gdoc}
    password: ${DATABASE_PASSWORD:gdoc123}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.gdoc.model.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
  type-handlers-package: com.gdoc.server.config.handler

file:
  upload:
    dir: ${UPLOAD_DIR:uploads}
    base-url: ${BASE_URL:http://localhost:8080}

logging:
  level:
    com.gdoc: info

gdoc:
  jwt:
    secret: ${JWT_SECRET:GdocSecretKey2026GdocSecretKey2026Gdoc}
    expiration: ${JWT_EXPIRATION:86400000}
