databases:
  - name: gdoc-postgres
    databaseName: gdoc
    user: gdoc
    plan: free

services:
  - type: redis
    name: gdoc-redis
    plan: free
    ipAllowList: []

  - type: web
    name: gdoc-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: DATABASE_URL
        fromDatabase:
          name: gdoc-postgres
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: gdoc-postgres
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: gdoc-postgres
          property: password
      - key: REDIS_HOST
        fromService:
          name: gdoc-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: gdoc-redis
          type: redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          name: gdoc-redis
          type: redis
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: BASE_URL
        value: ""
      - key: UPLOAD_DIR
        value: /app/uploads
